<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - User Management</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            background: #fafafa;
            margin: 0;
            color: #333;
        }

        @media (min-width: 768px) {
            body { padding: 2rem; }
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.25rem;
            font-size: 1.6rem;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card { 
            background: white; 
            padding: 1.25rem; 
            width: 100%;
            max-width: 440px; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            margin-bottom: 2rem; 
        }

        /* Prevent iOS auto-zoom by ensuring font-size is at least 16px */
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
        }

        /* Touch-friendly buttons */
        button { 
            font-family: inherit;
            padding: 12px 16px; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 44px;
            touch-action: manipulation;
            user-select: none;
            transition: opacity 0.15s ease, transform 0.05s ease;
        }

        button:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        button.create { 
            background: #28a745; 
            width: 100%; 
            margin-top: 4px;
        }
        button.edit { background: #d4a017; }
        button.delete { background: #d10e0e; }

        #msg {
            margin: 10px 0 0 0;
            font-size: 0.9rem;
            word-break: break-all;
            min-height: 1.2em;
        }

        /* Responsive Table -> Card Stack on Mobile */
        table { 
            border-collapse: collapse; 
            width: 100%; 
            max-width: 850px; 
            background: white; 
        }

        @media (max-width: 680px) {
            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            
            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            
            tr {
                background: white;
                border: 1px solid #e1e4e8;
                border-radius: 10px;
                padding: 12px;
                margin-bottom: 12px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            }
            
            td { 
                border: none;
                padding: 8px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                font-size: 0.9rem;
                border-bottom: 1px dashed #eee;
                word-break: break-all;
            }

            td:last-child {
                border-bottom: none;
                padding-top: 12px;
                display: flex;
                gap: 8px;
            }

            /* Responsive Labels */
            td:nth-of-type(1)::before { content: "User ID"; font-weight: bold; text-align: left; }
            td:nth-of-type(2)::before { content: "Username"; font-weight: bold; text-align: left; }
            td:nth-of-type(3)::before { content: "Last Login"; font-weight: bold; text-align: left; }

            td:last-child button {
                flex: 1;
                text-align: center;
                padding: 10px 4px;
                font-size: 0.85rem;
            }
        }

        /* Desktop Table View */
        @media (min-width: 681px) {
            th, td { 
                border: 1px solid #ddd; 
                padding: 10px 12px; 
                text-align: left; 
            }
            th { 
                background: #f1f3f5; 
                font-weight: 600;
            }
            td button {
                margin-right: 4px;
            }
        }
    </style>
</head>
<body>
    <h2>Admin Dashboard</h2>
    <div class="card">
        <h3>Onboard New User</h3>
        <input type="text" id="newUsername" placeholder="Username" autocomplete="off" autocapitalize="none">
        <input type="password" id="newPassword" placeholder="Password">
        <button class="create" onclick="createUser()">Create User</button>
        <p id="msg"></p>
    </div>

    <h3>Registered Users</h3>
    <table>
        <thead><tr><th>User ID</th><th>Username</th><th>Last Login</th><th>Actions</th></tr></thead>
        <tbody id="userTable"></tbody>
    </table>

<script>
    const actions = {
        'delete-user': ({user_id}) => deleteUser(user_id),
        'edit-user': ({user_id}) => editUser(user_id)
    };

    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = '';
        users.forEach(u => {
            tbody.innerHTML += `
            <tr>
                <td>${u.id}</td>
                <td>${u.username}</td>
                <td>${new Date(u.last_login*1000/*seconds -> miliseconds*/).toISOString()}</td>
                <td>
                    <button class="add-click-handler edit" data-onclick-action="edit-user" data-onclick-params='\{"user_id":"${u.id}"}'>Edit User Data</button>
                    <button class="add-click-handler delete" data-onclick-action="delete-user" data-onclick-params='\{"user_id":"${u.id}"}'>Delete User</button>
                </td>
            </tr>`;
        });

        document.querySelectorAll('button.add-click-handler').forEach(b => 
            b.addEventListener('click', event => {
                actions[event.currentTarget.getAttribute("data-onclick-action")](JSON.parse(event.currentTarget.getAttribute('data-onclick-params')));
            })
    );
    }

    async function createUser() {
        const username = document.getElementById('newUsername').value;
        const password = document.getElementById('newPassword').value;
        const msg = document.getElementById('msg');

        const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
            msg.style.color = 'green';
            msg.innerText = `User ${data.username} created! (ID: ${data.userId})`;
            loadUsers();
        } else {
            msg.style.color = 'red';
            msg.innerText = data.error;
        }
    }

    async function editUser(user_id) {
        const username = prompt("Input new username(or blank to skip):");
        const password = prompt("Input new password(or blank to skip):");
        const msg = document.getElementById('msg');

        let body = {user_id};

        if (username !== null) {
            body.username = username;
        }
        if (password !== null) {
            body.password = password;
        }
        console.log(body);
        
        const res = await fetch('/api/admin/users', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();

        if (res.ok) {
            msg.style.color = '#856404'; // Adjusted to readable gold/yellow
            msg.innerText = `User with ID ${data.userId} modified!`;
            loadUsers();
        } else {
            msg.style.color = 'red';
            msg.innerText = data.error;
        }
    }

    async function deleteUser(user_id) {
        const msg = document.getElementById('msg');
        const res = await fetch('/api/admin/users',{
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id })
        });
        const data = await res.json();

        if (res.ok) {
            msg.style.color = 'orange';
            msg.innerText = `User with ID ${data.userId} has been deleted!`
            loadUsers();
        } else {
            msg.style.color = 'red';
            msg.innerText = data.error;
        }
    }

    loadUsers();
</script>
</body>
</html>
